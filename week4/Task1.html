<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form to Table</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        form {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h2>Enter Information</h2>
    
    <form id="infoForm">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required><br><br>
        
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required><br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        
        <button type="submit" id="addButton">Add</button>
        <button type="button" id="clearButton">Clear</button>
    </form>

    <h2>Information Table</h2>
    <table id="infoTable">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            <!-- Table rows will be added here -->
        </tbody>
    </table>

    <script>
        $(document).ready(function() {
            // Load data from localStorage on page load
            loadTable();

            // Add information to the table
            $('#addButton').click(function(event) {
                event.preventDefault(); // Prevent form submission

                // Get values from the form
                var firstName = $('#firstName').val();
                var lastName = $('#lastName').val();
                var email = $('#email').val();

                // Check if the fields are empty
                if (firstName === "" || lastName === "" || email === "") {
                    alert("Please fill out all fields.");
                    return;
                }

                // Create an object to hold the form data
                var student = {
                    firstName: firstName,
                    lastName: lastName,
                    email: email
                };

                // Retrieve current data from localStorage
                var students = JSON.parse(localStorage.getItem("students")) || [];

                // Add the new student to the array
                students.push(student);

                // Save the updated array back to localStorage
                localStorage.setItem("students", JSON.stringify(students));

                // Add the new student to the table
                $('#infoTable tbody').append(
                    '<tr><td>' + firstName + '</td><td>' + lastName + '</td><td>' + email + '</td></tr>'
                );

                // Clear the form fields
                $('#infoForm')[0].reset();
            });

            // Clear all data (form fields and table)
            $('#clearButton').click(function() {
                localStorage.removeItem("students"); // Clear data from localStorage
                $('#infoTable tbody').empty(); // Remove all rows from the table
                $('#infoForm')[0].reset(); // Reset the form fields
            });

            // Function to load data from localStorage to the table
            function loadTable() {
                var students = JSON.parse(localStorage.getItem("students")) || [];
                students.forEach(function(student) {
                    $('#infoTable tbody').append(
                        '<tr><td>' + student.firstName + '</td><td>' + student.lastName + '</td><td>' + student.email + '</td></tr>'
                    );
                });
            }
        });
    </script>

</body>
</html>
