<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form to Table</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-10">
    <div class="max-w-4xl w-full bg-white shadow-md rounded-lg p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Enter Information</h2>
        <form id="infoForm" class="space-y-4">
            <div>
                <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
                <input type="text" id="firstName" name="firstName" required
                       class="mt-1 p-2 w-full border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
                <input type="text" id="lastName" name="lastName" required
                       class="mt-1 p-2 w-full border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required
                       class="mt-1 p-2 w-full border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-end space-x-4">
                <button type="submit" id="addButton"
                        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none">
                    Add
                </button>
                <button type="button" id="clearButton"
                        class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 focus:outline-none">
                    Clear
                </button>
            </div>
        </form>
    </div>

    <div class="max-w-4xl w-full mt-10 bg-white shadow-md rounded-lg p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Information Table</h2>
        <table id="infoTable" class="w-full border-collapse border border-gray-200">
            <thead class="bg-gray-100">
                <tr>
                    <th class="border border-gray-200 px-4 py-2 text-left text-sm font-medium text-gray-600">First Name</th>
                    <th class="border border-gray-200 px-4 py-2 text-left text-sm font-medium text-gray-600">Last Name</th>
                    <th class="border border-gray-200 px-4 py-2 text-left text-sm font-medium text-gray-600">Email</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                <!-- Table rows will be added here -->
            </tbody>
        </table>
    </div>

    <script>
        $(document).ready(function () {
            // Load data from localStorage on page load
            loadTable();

            // Add information to the table
            $('#addButton').click(function (event) {
                event.preventDefault(); // Prevent form submission

                // Get values from the form
                var firstName = $('#firstName').val();
                var lastName = $('#lastName').val();
                var email = $('#email').val();

                // Check if the fields are empty
                if (firstName === "" || lastName === "" || email === "") {
                    alert("Please fill out all fields.");
                    return;
                }

                // Create an object to hold the form data
                var student = {
                    firstName: firstName,
                    lastName: lastName,
                    email: email
                };

                // Retrieve current data from localStorage
                var students = JSON.parse(localStorage.getItem("students")) || [];

                // Add the new student to the array
                students.push(student);

                // Save the updated array back to localStorage
                localStorage.setItem("students", JSON.stringify(students));

                // Add the new student to the table
                $('#infoTable tbody').append(
                    '<tr><td class="border border-gray-200 px-4 py-2">' + firstName +
                    '</td><td class="border border-gray-200 px-4 py-2">' + lastName +
                    '</td><td class="border border-gray-200 px-4 py-2">' + email + '</td></tr>'
                );

                // Clear the form fields
                $('#infoForm')[0].reset();
            });

            // Clear all data (form fields and table)
            $('#clearButton').click(function () {
                localStorage.removeItem("students"); // Clear data from localStorage
                $('#infoTable tbody').empty(); // Remove all rows from the table
                $('#infoForm')[0].reset(); // Reset the form fields
            });

            // Function to load data from localStorage to the table
            function loadTable() {
                var students = JSON.parse(localStorage.getItem("students")) || [];
                students.forEach(function (student) {
                    $('#infoTable tbody').append(
                        '<tr><td class="border border-gray-200 px-4 py-2">' + student.firstName +
                        '</td><td class="border border-gray-200 px-4 py-2">' + student.lastName +
                        '</td><td class="border border-gray-200 px-4 py-2">' + student.email + '</td></tr>'
                    );
                });
            }
        });
    </script>
</body>
</html>
