<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product List</title>
  <!-- Include Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-center mb-6">Product List</h1>
    <div class="text-center mb-6">
      <button 
        id="getData"
        class="px-6 py-2 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75"
      >
        Fetch Products
      </button>
    </div>
    <div class="text-center mb-6"> Restful API:
      <a class="text-blue-500 underline" href="https://mykhode.github.io/ITE-Year3-Web-Course/week4/api.json">https://mykhode.github.io/ITE-Year3-Web-Course/week4/api.json</a>
    </div>
    <div class="overflow-x-auto">
      <table class="table-auto w-full bg-white shadow-md rounded-lg border-collapse">
        <thead>
          <tr class="bg-blue-100">
            <th class="px-4 py-2 text-left border-b-2">Image</th>
            <th class="px-4 py-2 text-left border-b-2">SKU</th>
            <th class="px-4 py-2 text-left border-b-2">Name</th>
            <th class="px-4 py-2 text-left border-b-2">Price</th>
            <th class="px-4 py-2 text-left border-b-2">Rating</th>
          </tr>
        </thead>
        <tbody id="productTable">
          <!-- Data will be injected here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Fetch data from GitHub
    document.getElementById('getData').addEventListener('click', function () {
      fetch('https://mykhode.github.io/ITE-Year3-Web-Course/week4/api.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.json();
        })
        .then(data => renderTable(data.products))
        .catch(error => console.error('Error fetching data:', error));
    });

    // Render data in table
    function renderTable(products) {
      const tableBody = document.getElementById('productTable');
      tableBody.innerHTML = ''; // Clear previous data

      products.forEach(product => {
        const row = document.createElement('tr');
        row.classList.add('hover:bg-gray-100');
        row.innerHTML = `
          <td class="px-4 py-2 border-t">
            <img src="${product.image}" alt="${product.name}" class="w-16 h-auto rounded">
          </td>
          <td class="px-4 py-2 border-t">${product.sku}</td>
          <td class="px-4 py-2 border-t">${product.name}</td>
          <td class="px-4 py-2 border-t">$${product.price.toFixed(2)}</td>
          <td class="px-4 py-2 border-t">${product.rating}</td>
        `;
        tableBody.appendChild(row);
      });
    }
  </script>
</body>
</html>
